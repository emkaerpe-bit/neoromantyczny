<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Potwierdzenie Zakupu | Neoromantyczny</title>
  <meta name="description" content="Potwierdzenie płatności i odbiór e-booka Zodiakalny Prezentownik."/>
  <link rel="icon" href="/favicon.svg?v=4.0" type="image/svg+xml"/>
  <link rel="icon" href="/favicon-32x32.png?v=4.0" type="image/png" sizes="32x32"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4.0"/>
  <link rel="stylesheet" href="/fonts.css"/>
  <meta name="theme-color" content="#0D0D12"/>
  <style>
    :root { --obsidian: #0D0D12; --surface: #16161D; --gold: #C9A84C; --ivory: #FAF8F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: radial-gradient(circle at top, #1a1a24 0%, var(--obsidian) 75%);
      color: var(--ivory); font-family: 'Inter', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      max-width: 540px; width: 100%; background: rgba(22, 22, 29, 0.92);
      border: 1px solid rgba(201, 168, 76, 0.28); border-radius: 24px;
      padding: 2.75rem 2rem; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }
    .badge {
      width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%;
      background: rgba(201, 168, 76, 0.14); border: 1px solid rgba(201, 168, 76, 0.35);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2rem; line-height: 1.2; margin-bottom: 1rem; }
    h1 span { color: var(--gold); font-style: italic; }
    p { color: rgba(250, 248, 245, 0.78); font-size: 1rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--gold); color: var(--obsidian); font-weight: 700; font-size: 1rem;
      padding: 1rem 2rem; border-radius: 999px; text-decoration: none;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.3); transition: transform 0.2s ease;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-ghost {
      display: inline-block; margin-top: 1.25rem; color: rgba(250, 248, 245, 0.55);
      font-size: 0.85rem; text-decoration: none;
    }
    .btn-ghost:hover { color: var(--gold); }
    .meta { margin-top: 1.75rem; font-size: 0.8rem; color: rgba(250, 248, 245, 0.45); line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" id="status-icon" style="color:#C9A84C;"><svg width="1.12em" height="1.12em" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.18em;flex-shrink:0;margin:0" aria-hidden="true"><polygon points="15.5,4 17.3,14.2 25.5,16 17.3,17.8 15.5,28 13.7,17.8 5.5,16 13.7,14.2" stroke-width="1.25" fill="currentColor" fill-opacity="0.18"/><path d="M10.8 11.3l9.4 9.4M20.2 11.3l-9.4 9.4" stroke-width="0.85" opacity="0.75"/><circle cx="24.5" cy="7.5" r="1.1" stroke="none" fill="currentColor"/></svg></div>
    <h1 id="status-title">Weryfikacja <span>płatności...</span></h1>
    <p id="status-desc">Trwa bezpieczne potwierdzanie transakcji w systemie Stripe. Proszę czekać chwilę.</p>
    <div id="action-area"></div>
    <p class="meta">
      W razie pytań lub problemów z pobraniem napisz na <strong>kontakt@neoromantyczny.pl</strong>.<br>
      <a href="/polityka-prywatnosci/" style="color:#C9A84C;text-decoration:underline;">Polityka Prywatności</a> &bull;
      <button type="button" data-open-cookie-settings style="background:none;border:0;padding:0;color:#C9A84C;font:inherit;cursor:pointer;text-decoration:underline;">Ustawienia cookies</button>
    </p>
  </main>
  <script src="/luxe-consent.js?v=1.1"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const pi = params.get('payment_intent');
      const product = params.get('product') || 'prezentownik';
      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const iconEl = document.getElementById('status-icon');
      const actionEl = document.getElementById('action-area');

      function showBlocked(msg) {
        iconEl.innerHTML = '<svg width="1.12em" height="1.12em" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.18em;flex-shrink:0;margin:0" aria-hidden="true"><path d="M7.5 13.5h17l-1 12.2a1.8 1.8 0 0 1-1.8 1.6h-11.4a1.8 1.8 0 0 1-1.8-1.6l-1-12.2Z" stroke-width="1.65"/><path d="M11.2 13.5v-3.2a4.8 4.8 0 0 1 9.6 0v3.2" stroke-width="1.6"/><circle cx="16" cy="18.8" r="1.3" stroke="none" fill="currentColor"/><line x1="16" y1="20" x2="16" y2="22.8" stroke-width="1.2"/></svg>';
        titleEl.innerHTML = 'Brak potwierdzonej <span>płatności</span>';
        descEl.textContent = msg;
        actionEl.innerHTML = '<a href="/" class="btn">Wróć na stronę główną &rarr;</a>';
      }

      function trackVerifiedPurchase(paymentIntentId, productKey, amountGrosze) {
        if (!paymentIntentId) return;
        const val = (typeof amountGrosze === 'number' && amountGrosze > 0) ? (amountGrosze / 100) : 47;
        let consentBound = false;
        let doneGads = false;
        function fire(consent) {
          try {
            if (!doneGads && typeof window.gtag === 'function') {
              const ak = 'neo_gads_tx_' + paymentIntentId;
              if (!sessionStorage.getItem(ak)) {
                sessionStorage.setItem(ak, '1');
                window.gtag('event', 'conversion', {
                  send_to: 'AW-18591369003/fph2CIfR870dEKuOh6FF',
                  value: val,
                  currency: 'PLN',
                  transaction_id: paymentIntentId
                });
              }
              doneGads = true;
            }
          } catch (_e) {}
          const c = consent || (window.neoConsent && typeof window.neoConsent.get === 'function' ? window.neoConsent.get() : null);
          if (!c) return false;
          let doneGa = !c.analytics, doneFb = !c.marketing;
          try {
            if (c.analytics && typeof window.gtag === 'function') {
              const gk = 'neo_ga4_tx_' + paymentIntentId;
              if (!sessionStorage.getItem(gk)) {
                sessionStorage.setItem(gk, '1');
                window.gtag('event', 'purchase', { transaction_id: paymentIntentId, value: val, currency: 'PLN', items: [{ item_id: productKey, item_name: 'Zodiakalny Prezentownik', price: val, quantity: 1 }] });
                if (typeof window.clarity === 'function') {
                  window.clarity('set', 'purchased_product', productKey);
                  window.clarity('event', 'purchase');
                }
              }
              doneGa = true;
            }
            if (c.marketing && typeof window.fbq === 'function') {
              const fk = 'neo_fb_tx_' + paymentIntentId;
              if (!sessionStorage.getItem(fk)) {
                sessionStorage.setItem(fk, '1');
                window.fbq('track', 'Purchase', { value: val, currency: 'PLN', content_name: productKey }, { eventID: paymentIntentId });
              }
              doneFb = true;
            }
          } catch (_e) {}
          return doneGads && doneGa && doneFb;
        }
        let tries = 0;
        (function poll() {
          if (!consentBound && window.neoConsent && typeof window.neoConsent.onChange === 'function') {
            consentBound = true;
            window.neoConsent.onChange(function (st) { fire(st); });
          }
          if (!fire(null) && ++tries < 16) setTimeout(poll, 250);
        })();
      }

      if (!pi) {
        showBlocked('Ta strona jest dostępna po sfinalizowaniu zamówienia. Jeśli właśnie opłaciłeś e-booka i nie widzisz linku, skontaktuj się z nami.');
        return;
      }

      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentIntentId: pi, product, chartHash: 'prezentownik|default' })
        });
        const data = await res.json();
        if (!res.ok || !data.verified) {
          showBlocked('Płatność nie została jeszcze zaksięgowana przez Stripe. Jeśli środki zostały pobrane, napisz do nas podając numer transakcji.');
          return;
        }
        trackVerifiedPurchase(pi, product, data.amount);
        const dlUrl = (data.downloadUrl && /^https:\/\//i.test(data.downloadUrl)) ? data.downloadUrl : '';
        titleEl.innerHTML = 'Płatność zakończona <span>sukcesem!</span>';
        if (dlUrl) {
          descEl.innerHTML = 'Twój e-book <strong>Zodiakalny Prezentownik</strong> jest gotowy do pobrania. Kliknij poniżej, aby zapisać plik PDF.';
          actionEl.innerHTML = '';
          const dlLink = document.createElement('a');
          dlLink.href = dlUrl;
          dlLink.target = '_blank';
          dlLink.rel = 'noopener noreferrer';
          dlLink.className = 'btn';
          dlLink.textContent = 'Pobierz Zodiakalny Prezentownik (PDF) ↓';
          const blogLink = document.createElement('a');
          blogLink.href = '/blog/';
          blogLink.className = 'btn-ghost';
          blogLink.textContent = 'Przejdź na bloga →';
          actionEl.appendChild(dlLink);
          actionEl.appendChild(document.createElement('br'));
          actionEl.appendChild(blogLink);
        } else {
          descEl.textContent = 'Płatność została potwierdzona! Link do pobrania nie jest obecnie dostępny — napisz na kontakt@neoromantyczny.pl podając numer transakcji.';
        }
      } catch (_err) {
        showBlocked('Nie udało się połączyć z serwerem weryfikacji płatności. Odśwież stronę za chwilę lub napisz do nas.');
      }
    })();
  </script>
</body>
</html>
