<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Potwierdzenie Zakupu | Neoromantyczny</title>
  <meta name="description" content="Potwierdzenie płatności i odbiór e-booka Zodiakalny Prezentownik."/>
  <link rel="icon" href="/favicon.svg?v=4.0" type="image/svg+xml"/>
  <link rel="icon" href="/favicon-32x32.png?v=4.0" type="image/png" sizes="32x32"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4.0"/>
  <link rel="stylesheet" href="/fonts.css"/>
  <meta name="theme-color" content="#0D0D12"/>
  <style>
    :root { --obsidian: #0D0D12; --surface: #16161D; --gold: #C9A84C; --ivory: #FAF8F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: radial-gradient(circle at top, #1a1a24 0%, var(--obsidian) 75%);
      color: var(--ivory); font-family: 'Inter', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      max-width: 540px; width: 100%; background: rgba(22, 22, 29, 0.92);
      border: 1px solid rgba(201, 168, 76, 0.28); border-radius: 24px;
      padding: 2.75rem 2rem; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }
    .badge {
      width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%;
      background: rgba(201, 168, 76, 0.14); border: 1px solid rgba(201, 168, 76, 0.35);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2rem; line-height: 1.2; margin-bottom: 1rem; }
    h1 span { color: var(--gold); font-style: italic; }
    p { color: rgba(250, 248, 245, 0.78); font-size: 1rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--gold); color: var(--obsidian); font-weight: 700; font-size: 1rem;
      padding: 1rem 2rem; border-radius: 999px; text-decoration: none;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.3); transition: transform 0.2s ease;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-ghost {
      display: inline-block; margin-top: 1.25rem; color: rgba(250, 248, 245, 0.55);
      font-size: 0.85rem; text-decoration: none;
    }
    .btn-ghost:hover { color: var(--gold); }
    .meta { margin-top: 1.75rem; font-size: 0.8rem; color: rgba(250, 248, 245, 0.45); line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" id="status-icon">✨</div>
    <h1 id="status-title">Weryfikacja <span>płatności...</span></h1>
    <p id="status-desc">Trwa bezpieczne potwierdzanie transakcji w systemie Stripe. Proszę czekać chwilę.</p>
    <div id="action-area"></div>
    <p class="meta">W razie pytań lub problemów z pobraniem napisz na <strong>kontakt@neoromantyczny.pl</strong>.</p>
  </main>
  <script>
    (async function () {
      const EBOOK_URL = 'https://drive.google.com/uc?export=download&id=14r9HvDx21VVsEKUmhBeCFY5n9fqJLc4u';
      const params = new URLSearchParams(window.location.search);
      const pi = params.get('payment_intent');
      const product = params.get('product') || 'prezentownik';
      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const iconEl = document.getElementById('status-icon');
      const actionEl = document.getElementById('action-area');

      function showBlocked(msg) {
        iconEl.textContent = '🔒';
        titleEl.innerHTML = 'Brak potwierdzonej <span>płatności</span>';
        descEl.textContent = msg;
        actionEl.innerHTML = '<a href="/" class="btn">Wróć na stronę główną &rarr;</a>';
      }

      if (!pi) {
        showBlocked('Ta strona jest dostępna po sfinalizowaniu zamówienia. Jeśli właśnie opłaciłeś e-booka i nie widzisz linku, skontaktuj się z nami.');
        return;
      }

      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentIntentId: pi, product })
        });
        const data = await res.json();
        if (!res.ok || !data.verified) {
          showBlocked('Płatność nie została jeszcze zaksięgowana przez Stripe. Jeśli środki zostały pobrane, napisz do nas podając numer transakcji.');
          return;
        }
        titleEl.innerHTML = 'Płatność zakończona <span>sukcesem!</span>';
        descEl.innerHTML = 'Twój e-book <strong>Zodiakalny Prezentownik</strong> jest gotowy do pobrania. Kliknij poniżej, aby zapisać plik PDF.';
        actionEl.innerHTML = `<a href="${EBOOK_URL}" target="_blank" rel="noopener noreferrer" class="btn">Pobierz Zodiakalny Prezentownik (PDF) &darr;</a><br><a href="/blog/" class="btn-ghost">Przejdź na bloga &rarr;</a>`;
      } catch (_err) {
        showBlocked('Nie udało się połączyć z serwerem weryfikacji płatności. Odśwież stronę za chwilę lub napisz do nas.');
      }
    })();
  </script>
</body>
</html>
